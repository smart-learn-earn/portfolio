<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <title>Image Notepad</title>
  <style>
    body{font-family:sans-serif;background:#f5f7fa;margin:0;padding:20px;}
    h1{margin-top:0;}
    #editor{width:100%;min-height:300px;padding:10px;border:1px solid #ccc;
            border-radius:8px;background:#fff;}
    .toolbar{margin-bottom:10px;}
    button,input{margin:5px;padding:6px 10px;border-radius:6px;border:1px solid #888;cursor:pointer;}
    #notesList{margin-top:20px;}
    .note-item{background:#fff;border:1px solid #ddd;padding:10px;border-radius:8px;margin-bottom:10px;}
    img{max-width:100%;border-radius:6px;margin:5px 0;}
  </style>
</head>
<body>
  <h1>📝 ROYAL YADAV (INVESTER&TRADER)</h1>

  <div class="toolbar">
    <input type="text" id="title" placeholder="Note Title">
    <input type="file" id="imgInput" accept="image/*">
    <button id="insertImg">Insert Image</button>
    <button id="saveBtn">Save Note</button>
  </div>

  <div id="editor" contenteditable="true">
   
  </div>
